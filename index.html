<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Családi adventi naptár</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pine:#142a1c; --pine2:#1d3a27; --pine3:#264a32;
    --paper:#f6eedc; --paper2:#ecdfc3; --berry:#9b1d2a; --berry2:#7c1520;
    --gold:#c8a24a; --ink:#2a2420; --muted:#6f655a;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:Manrope,system-ui,sans-serif; color:var(--paper);
    background:
      radial-gradient(1200px 600px at 50% -10%, #2c5238 0%, transparent 60%),
      radial-gradient(800px 500px at 100% 100%, #1a3524 0%, transparent 60%),
      var(--pine);
    min-height:100vh; overflow-x:hidden;
  }
  #snow{position:fixed;inset:0;pointer-events:none;z-index:0}
  .wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:28px 16px 120px}
  header{text-align:center;margin-bottom:22px}
  .kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
  h1{font-family:Fraunces,serif;font-weight:800;font-size:clamp(30px,8vw,44px);line-height:1.05;margin:8px 0 6px;letter-spacing:-.01em}
  .from{font-family:Fraunces,serif;font-style:italic;color:#d9ccb0;font-size:17px}
  .status{margin:16px auto 0;display:inline-block;padding:8px 14px;border-radius:999px;background:rgba(246,238,220,.08);border:1px solid rgba(200,162,74,.35);font-size:13px;color:#e8dcc2}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:10px;grid-auto-flow:dense}
  .door{position:relative;border:0;padding:0;background:transparent;cursor:pointer;aspect-ratio:1/1;perspective:700px;-webkit-tap-highlight-color:transparent}
  .door.w2{grid-column:span 2;aspect-ratio:auto}
  .door.h2{grid-row:span 2;aspect-ratio:auto}
  .door.big{grid-column:span 2;grid-row:span 2;aspect-ratio:auto}
  .inside{position:absolute;inset:0;border-radius:10px;background-size:cover!important;background-position:center!important;background:linear-gradient(160deg,var(--pine3),#0f2016);box-shadow:inset 0 2px 10px rgba(0,0,0,.5);display:grid;place-items:center;font-size:clamp(26px,7vw,36px)}
  .big .inside{font-size:56px}
  .leaf{position:absolute;inset:0;border-radius:10px;background:var(--paper);color:var(--berry);
    display:grid;place-items:center;transform-origin:left center;transition:transform .7s cubic-bezier(.2,.8,.2,1),box-shadow .3s;
    box-shadow:0 3px 0 var(--paper2),0 8px 18px rgba(0,0,0,.35);backface-visibility:hidden}
  .leaf::before{content:"";position:absolute;inset:5px;border:1.5px dashed rgba(155,29,42,.35);border-radius:7px}
  .leaf .num{font-family:Fraunces,serif;font-weight:800;font-size:clamp(24px,7vw,34px);position:relative}
  .big .leaf .num{font-size:64px}
  .door.alt .leaf{background:var(--berry);color:var(--paper);box-shadow:0 3px 0 var(--berry2),0 8px 18px rgba(0,0,0,.35)}
  .door.alt .leaf::before{border-color:rgba(246,238,220,.35)}
  .door.gold .leaf{background:linear-gradient(145deg,#e3c676,var(--gold));color:var(--pine)}
  .door.gold .leaf::before{border-color:rgba(20,42,28,.3)}
  .door.open .leaf{transform:rotateY(-108deg)}
  .door.locked .leaf{filter:saturate(.85)}
  .door.today:not(.open) .leaf{animation:glow 2.2s ease-in-out infinite}
  .door.today:not(.open)::after{content:"MA";position:absolute;top:-7px;right:-5px;z-index:3;background:var(--gold);color:var(--pine);font-weight:800;font-size:10px;padding:3px 6px;border-radius:6px;letter-spacing:.08em}
  @keyframes glow{0%,100%{box-shadow:0 3px 0 var(--paper2),0 0 0 0 rgba(200,162,74,.0)}50%{box-shadow:0 3px 0 var(--paper2),0 0 0 6px rgba(200,162,74,.45)}}
  .door.shake{animation:shake .45s}
  @keyframes shake{20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}

  /* sheet */
  .scrim{position:fixed;inset:0;background:rgba(5,12,8,.6);opacity:0;pointer-events:none;transition:opacity .3s;z-index:10}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:50%;bottom:0;width:min(560px,100%);transform:translate(-50%,105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:11;
    background:var(--paper);color:var(--ink);border-radius:22px 22px 0 0;padding:14px 22px 34px;max-height:88vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
  .sheet.on{transform:translate(-50%,0)}
  .grab{width:42px;height:5px;border-radius:9px;background:#d5c7a8;margin:0 auto 14px}
  .sheet .day{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--berry);font-weight:800}
  .sheet h2{font-family:Fraunces,serif;font-size:28px;line-height:1.1;margin:6px 0 14px}
  .sheet p{font-size:16px;line-height:1.6;margin:0 0 12px;white-space:pre-line}
  .close{position:absolute;top:12px;right:14px;border:0;background:#ece2cb;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--ink)}
  .photo{aspect-ratio:auto;max-height:62vh;background:#e9dcc0!important;border-radius:14px;margin:4px 0 14px;display:grid;place-items:center;text-align:center;font-size:64px;
    background:linear-gradient(135deg,#d9c39a,#b98e5f);color:#fff;position:relative;overflow:hidden}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .photo small{position:absolute;bottom:10px;left:0;right:0;font-size:12px;letter-spacing:.06em;opacity:.85;font-family:Manrope}
  .ticket{border:2px dashed var(--berry);border-radius:14px;padding:18px;background:#fff8ea;margin:6px 0 14px;text-align:center}
  .ticket .t1{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--berry);font-weight:800}
  .ticket .t2{font-family:Fraunces,serif;font-size:22px;font-weight:600;margin-top:6px}
  .badge{display:inline-block;background:var(--pine2);color:var(--paper);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:999px;margin-bottom:10px}
  .recipe{background:#fff8ea;border-radius:14px;padding:16px 18px;margin:6px 0 14px;font-size:15px;line-height:1.7;white-space:pre-line}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--pine2);color:var(--paper);border:0;border-radius:12px;padding:12px 16px;font:700 15px Manrope;text-decoration:none;cursor:pointer}
  .btn[aria-disabled="true"]{opacity:.55;cursor:default}
  .extra{font-family:Fraunces,serif;font-style:italic;color:var(--muted);font-size:16px;line-height:1.55;border-left:3px solid var(--gold);padding-left:12px;margin:4px 0 6px}
  .letter{font-family:Fraunces,serif;font-size:18px;line-height:1.65}
  .sign{font-family:Fraunces,serif;font-style:italic;text-align:right;margin-top:10px;color:var(--berry);font-size:18px}

  .toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-140%);background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:20;transition:transform .35s,opacity .35s;opacity:0;visibility:hidden;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:90vw;text-align:center}
  .toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}

  /* demo bar */
  .demo{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(540px,calc(100% - 20px));z-index:5;
    background:rgba(10,22,14,.92);border:1px solid rgba(200,162,74,.4);border-radius:16px;padding:10px 14px;backdrop-filter:blur(8px)}
  .demo .row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#d9ccb0}
  .demo b{color:var(--gold);letter-spacing:.12em}
  .demo input{width:100%;accent-color:var(--gold);margin:8px 0 2px}
  .demo .reset{background:none;border:1px solid rgba(217,204,176,.35);color:#d9ccb0;border-radius:8px;padding:3px 8px;font:600 11px Manrope;cursor:pointer}
  footer{text-align:center;margin-top:26px;font-size:12px;color:#9fb2a4}
  @media (prefers-reduced-motion:reduce){.leaf,.sheet,.toast{transition:none}.door.today .leaf{animation:none}}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<div class="wrap">
  <header>
    <div class="kicker">Adventi naptár</div>
    <h1 id="title">Családi adventi naptár</h1>
    <div class="from" id="from"></div>
    <div class="status" id="status"></div>
  </header>
  <main class="grid" id="grid" aria-label="Adventi ajtók"></main>
  <footer>Minden nap kinyílik egy új ajtó (budapesti idő szerint).</footer>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grab"></div>
  <button class="close" id="close" aria-label="Bezárás">×</button>
  <div id="sheetBody"></div>
</section>
<div class="toast" id="toast" role="status"></div>

<div class="demo" id="demo">
  <div class="row"><span><b>ELŐNÉZET</b> · Tegyük fel, hogy ma: <strong id="demoLabel"></strong></span><button class="reset" id="reset">Újrakezd</button></div>
  <input type="range" id="demoDay" min="0" max="25" step="1" value="1" aria-label="Demó dátum">
</div>

<script>
/* ---------- Calendar data ----------
   In production this comes from the Worker: GET /api/c/<id>
   (only already-unlocked doors contain content). In the demo it is embedded. */
const DEMO = location.hash === "#elonezet";
const CAL = {
  id: "csalad2026",
  title: "Családi adventi naptár",
  fromLine: "A házikedvencek ajánlásával 🐾",
  doors: [
    {day:1,img:"day1-turbo-rendor.jpg",emoji:"🚔",title:"Turbó rendőrfőkapitány szolgálatban",text:"Turbó rendőrfőkapitány ellenőrzi, hogy csak napi egy ablakot nyithass ki! Nincs csalás."},
    {day:2,img:"bori-pihenonap.jpg",emoji:"😴",voucher:true,title:"Egy pihenőnap",text:"A mai jutalmad egy pihenőnap, Bori cica ajánlásával.",extra:"Szakértői útmutató: 1. Feküdj le. 2. Nyújtózz. 3. Ismételd napnyugtáig."},
    {day:3,img:"karcsika-mazli.jpg",emoji:"📦",title:"Hoppá!",text:"A mai ablakot már kinyitotta Karcsika és Mázli.",extra:"A doboz mostantól az övék. Holnap próbáld újra – de kelj korábban."},
    {day:4,img:"ulka-lolka.jpg",emoji:"🐕",voucher:true,title:"Séta Ulkával és Lolkával",text:"Ha jól viselkedsz idén, elmehetsz Ulkával és Lolkával sétálni.",extra:"A jó magaviseletet Turbó rendőrfőkapitány igazolja."},
    {day:5,img:"picur-mikulas.jpg",emoji:"🎅",title:"Mindjárt jön!",text:"Picúr már izgatottan várja a Mikulást.",extra:"Ma este ne felejtsd el kipucolni és kitenni a csizmát!"},
    {day:6,img:"artur-csizma.jpg",emoji:"😾",title:"Mikulás reggel",text:"Nem pucoltad meg a csizmádat! Ezért most csoki helyett egy mérges K. Artúr várt a csizmádban."},
    {day:7,img:"karacsonyi-pulcsi.jpg",emoji:"🦌",title:"Pulcsiszezon",text:"A karácsonyi pulcsikat elővenni!"},
    {day:8,img:"karacsonyi-wellness.jpg",emoji:"🛁",title:"Karácsonyi wellness",text:"Karácsonyi wellness.",extra:"Ma elérhető: hideg porcelán, csepegő csap, kilátás a szappanra. Foglalás nem szükséges."},
    {day:9,img:"kez-lab-tores.jpg",emoji:"🦿",title:"Óvatosan a jókívánságokkal!",text:"Kéz- és lábtörést óvatosan kívánj idén!"},
    {day:10,img:"turbo-outfit.jpg",emoji:"🐆",title:"Outfit-ellenőrzés",text:"Megvan már a karácsonyi outfited?",extra:"Turbóé már megvan. A tálja viszont még üres… csak szólok."},
    {day:11,img:"metro-szaguldas.jpg",emoji:"🚇",title:"Teljes gőzzel",text:"Száguldunk az ünnepek felé!",extra:"Következő megálló: Karácsony."},
    {day:12,img:"indulhat-a-pihenes.jpg",emoji:"😺",title:"Hétvége!",text:"Indulhat a pihenés!"},
    {day:13,img:"pizsamas-erzsi.jpg",emoji:"😴",title:"Pizsamás Erzsi",text:"Pizsamás Erzsi üzeni: ma szabad egész nap pizsamában maradni. Szigorúan ellenőrizni fogja."},
    {day:14,img:"arcod-x-nap.jpg",emoji:"🤪",title:"Arcod, amikor…",text:"Arcod, amikor már csak 10 nap és karácsony!"},
    {day:15,img:"love-actually.jpg",emoji:"💌",title:"Igazából szerelem",text:"Idén is lesz Igazából szerelem?",extra:"Filmest: takaró, forralt bor, és mindenki úgy tesz, mintha nem sírna a végén."},
    {day:16,img:"morcos-teknoc.jpg",emoji:"😾",title:"Pixel üzeni",text:"Ne húzzál fel, hogy még mindig nincs itt a karácsony!"},
    {day:17,img:"csillagszoro.jpg",emoji:"✨",title:"Egy hét!",text:"Készítsétek a csillagszórót!"},
    {day:18,img:"ajandek-megvetted.jpg",emoji:"🎁",title:"Kérdés",text:"Az ajándékot már megvetted?",extra:"Ne nézz így. Még 6 napod van. Talán."},
    {day:19,img:"karacsonyi-buli.jpg",emoji:"🥳",title:"Bulihangulat",text:"Már csak pár nap, és indul a karácsonyi buli!"},
    {day:20,img:"kipihenni.jpg",emoji:"🛋️",title:"Töltődés",text:"Ne felejtsd el kipihenni magad az ünnepekre!"},
    {day:21,img:"kolykok-turelem.jpg",emoji:"⏳",title:"Türelem!",text:"Legyél türelmes, mindjárt itt a karácsony!"},
    {day:22,img:"day22-ketto-aludni.jpg",emoji:"🌙",title:"Visszaszámlálás",text:"Már csak kettőt kell aludni!"},
    {day:23,img:"day23-turbo-mano.jpg",emoji:"🧝",title:"Manó-szolgálat",text:"Turbó manó-szolgálatba lépett. Holnap jön a nagy nap!"},
    {day:24,img:"day24-kiscica-aradat.jpg",emoji:"🎄",finale:true,title:"Boldog karácsonyt!",text:"24 nap várakozás után itt a jutalom: kiscica-áradat!",extra:"Boldog karácsonyt kíván Turbó rendőrfőkapitány, Borika, Karcsika, Mázli, Ulka, Lolka, Picúr, K. Artúr, Erzsi, Pixel és az egész csapat. 🐾"}
  ]
};

/* Layout: shuffled order + a few bigger doors, like a real advent calendar */
const ORDER = [7,18,3,12,24,9,1,15,21,5,13,20,2,10,16,6,23,11,4,19,14,8,22,17];
const SIZE  = {24:"big",6:"w2",13:"w2",18:"h2",1:"h2",22:"w2"};
const STYLE = d => d===24||d===6||d===13 ? "gold" : (d%3===0 ? "alt" : "");

/* ---------- Date logic (mirrors the Worker) ---------- */
function budapestToday(){
  const s = new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Budapest",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
  const [y,m,d] = s.split("-").map(Number); return {y,m,d};
}
function unlockedFromDate({m,d}){ if(m===12) return Math.min(d,24); if(m===1) return 24; return 0; }

/* ---------- State ---------- */
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem("adv-open-"+CAL.id)||"[]"); }catch(e){ return []; } },
  set(v){ try{ localStorage.setItem("adv-open-"+CAL.id, JSON.stringify(v)); }catch(e){} }
};
let opened = new Set(store.get());
let unlocked = 0;

const $ = id => document.getElementById(id);
const grid = $("grid");

function render(){
  grid.innerHTML = "";
  ORDER.forEach(day=>{
    const door = CAL.doors.find(x=>x.day===day);
    const b = document.createElement("button");
    b.className = ["door", SIZE[day]||"", STYLE(day)].join(" ").trim();
    b.dataset.day = day;
    const isOpen = opened.has(day) && day<=unlocked;
    if(isOpen) b.classList.add("open");
    if(day>unlocked) b.classList.add("locked");
    if(day===unlocked && unlocked>=1 && unlocked<=24) b.classList.add("today");
    b.setAttribute("aria-label", `${day}. ajtó` + (day>unlocked ? " (még zárva)" : ""));
    b.innerHTML = `<div class="inside" ${day<=unlocked && door ? `style="background-image:url(img/${door.img})"` : ""}></div><div class="leaf"><span class="num">${day}</span></div>`;
    b.addEventListener("click", ()=>onDoor(b, day));
    grid.appendChild(b);
  });
  updateStatus();
}

function updateStatus(){
  let t;
  if(unlocked===0) t = "Az első ajtó december 1-jén nyílik ✨";
  else if(unlocked>=24) t = "Minden ajtó nyitva – boldog karácsonyt! 🎄";
  else { const left = 24-unlocked; t = `Még ${left} nap Szentestéig · ${opened.size} ajtót nyitottál ki`; }
  $("status").textContent = t;
}

function onDoor(el, day){
  if(day>unlocked){
    el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
    const diff = day - unlocked;
    toast(unlocked===0 ? `🚔 Turbó rendőrfőkapitány: ez az ajtó csak december ${huDay(day)} nyílik!` : `🚔 Turbó rendőrfőkapitány szerint ez még zárva! Gyere vissza ${diff} nap múlva.`);
    return;
  }
  const first = !opened.has(day);
  el.classList.add("open"); el.classList.remove("today");
  opened.add(day); store.set([...opened]); updateStatus();
  setTimeout(()=>openSheet(day), first ? 550 : 0);
}

/* Hungarian date suffix: 1-jén, 2-án, 3-án, 4-én ... */
function huDay(d){
  const an = [2,3,6,8,13,16,18,20,23];
  if(d===1) return "1-jén";
  return d + (an.includes(d) ? "-án" : "-én");
}

function esc(s){ return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function openSheet(day){
  const d = CAL.doors.find(x=>x.day===day);
  let body = `<div class="day">December ${day}.</div><h2 id="sheetTitle">${esc(d.title)}</h2>`;
  body += `<div class="photo"><img src="img/${esc(d.img)}" alt="${esc(d.title)}"></div>`;
  if(d.voucher) body += `<div class="ticket"><div class="t1">Kupon · beváltható 1×</div><div class="t2">${d.emoji} ${esc(d.title)}</div></div>`;
  body += d.finale ? `<div class="letter"><p>${esc(d.text)}</p></div>` : `<p>${esc(d.text)}</p>`;
  if(d.extra) body += `<div class="extra">${esc(d.extra)}</div>`;
  $("sheetBody").innerHTML = body;
  $("scrim").classList.add("on"); $("sheet").classList.add("on");
  $("close").focus();
}
function closeSheet(){ $("scrim").classList.remove("on"); $("sheet").classList.remove("on"); }
$("close").onclick = closeSheet; $("scrim").onclick = closeSheet;
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSheet(); });

let tt;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),2200); }

/* ---------- Demo controls ---------- */
function demoLabel(v){ return v===0 ? "november" : v>24 ? "karácsony után" : `december ${v}.`; }
function setDemo(v){ unlocked = Math.min(v,24); $("demoLabel").textContent = demoLabel(v); render(); }
if(DEMO){
  $("demoDay").addEventListener("input", e=>setDemo(+e.target.value));
  $("reset").onclick = ()=>{ opened = new Set(); store.set([]); render(); toast("Minden ajtó újra zárva."); };
  setDemo(+$("demoDay").value);
} else {
  $("demo").remove();
  unlocked = unlockedFromDate(budapestToday());
  render();
}
$("title").textContent = CAL.title;
$("from").textContent = CAL.fromLine;

/* ---------- Snow ---------- */
(function(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=$("snow"), x=c.getContext("2d"); let W,H,f=[];
  function size(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  size(); addEventListener("resize",size);
  for(let i=0;i<55;i++) f.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.2+.6,s:Math.random()*.5+.25,w:Math.random()*Math.PI*2});
  (function tick(){
    x.clearRect(0,0,W,H); x.fillStyle="rgba(246,238,220,.75)";
    for(const p of f){ p.y+=p.s; p.w+=.01; p.x+=Math.sin(p.w)*.3; if(p.y>H){p.y=-5;p.x=Math.random()*W;}
      x.beginPath(); x.arc(p.x,p.y,p.r,0,Math.PI*2); x.fill(); }
    requestAnimationFrame(tick);
  })();
})();
</script>
</body>
</html>
